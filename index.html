<!DOCTYPE html>
<html lang="es">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Ahorro Pro</title>

<link rel="icon" href="img/Icono.png">

    <link rel="stylesheet" href="style.css">

</head>

<body>

<div class="card">

    <div class="emojiPrincipal" style="font-size:120px;">💻</div>

    <h1 id="tituloProyecto">Mi nuevo PC</h1>

    <div id="dinero">0€</div>

    <div class="barra">

        <div class="progreso" id="progreso"></div>

        <div class="marca marca1000">
            <span id="marcaMinima">1000€</span>
        </div>

        <div class="marca marca1500">
            <span id="marcaIdeal">1500€</span>
        </div>

    </div>

    <div id="porcentaje">
        20%
    </div>

    <p id="progresoTexto">
        ⏳ Te faltan 700 € para el objetivo mínimo.
    </p>

    <div class="botones">

        <button onclick="sumar(10)">+10 €</button>
        <button onclick="sumar(50)">+50 €</button>
        <button onclick="sumar(100)">+100 €</button>
        <button onclick="sumar(500)">+500 €</button>

    </div>

    <div class="botones">

        <button class="rojo" onclick="restar(10)">-10 €</button>
        <button class="rojo" onclick="restar(50)">-50 €</button>
        <button class="rojo" onclick="restar(100)">-100 €</button>
        <button class="rojo" onclick="restar(500)">-500 €</button>

    </div>

    <div id="mensaje">
        🚀 Sigue ahorrando.
    </div>

 <button id="abrirAjustes">
    ⚙️ Ajustes
</button>

</div>

<!-- Ventana de ajustes -->
<div id="popupAjustes" class="popup">

    <div class="popup-contenido">

        <h2>⚙️ Ajustes</h2>

        <label>Nombre del proyecto</label>
        <input type="text" id="nombreProyecto">

       <label>Emoji</label>

<div id="selectorEmojis">

    <button class="emoji">💻</button>
    <button class="emoji">🎮</button>
    <button class="emoji">🚗</button>
    <button class="emoji">🏠</button>

    <button class="emoji">✈️</button>
    <button class="emoji">📱</button>
    <button class="emoji">💰</button>
    <button class="emoji">🏆</button>

</div>

        <label>Objetivo mínimo (€)</label>
        <input type="number" id="objetivoMinimo">

        <label>Objetivo ideal (€)</label>
        <input type="number" id="objetivoIdeal">

        <button id="guardarAjustes">💾 Guardar</button>
        <button id="cerrarAjustes">❌ Cerrar</button>

    </div>

</div>

<script src="script.js"></script>

</body>
</html>
